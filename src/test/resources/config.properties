baseUrl=https://techvan.net/en
browser=chrome
headless=false
implicitWait=0
explicitWait=15
shortWait=5
pageLoadTimeout=40

# --- Login (optional) ---
# Leave loginPath blank to reach login by clicking the profile icon on the home page.
loginPath=
# Valid credentials are NEVER stored here. Pass them at run time:
#   -DloginEmail=you@example.com -DloginPassword=secret
# or set env vars TECHVAN_LOGIN_EMAIL / TECHVAN_LOGIN_PASSWORD.

# --- Optional locator override if the default product-card XPath is wrong for the site ---
productCardXpath=

# --- Extra pages (leave blank to reach them through the site's own links/icons) ---
registerPath=
cartPath=/cart
trackingPath=
ordersPath=/account/orders

# --- Safety switches: both OFF by default. Nothing here ever clicks Place Order / Pay. ---
# allowRegistration=true  -> runs the scenario that creates a REAL account on the live site
# allowCheckoutProgress=true -> fills delivery details with fake data and clicks "Continue" (never "Place Order")
allowRegistration=false
allowCheckoutProgress=false

# --- "Avail Offer" pop-up on product pages: existing | new | another ---
offerOption=another
